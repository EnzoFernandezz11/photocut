<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Optical flatbed chassis: warm darkroom espresso, stepped bronze bezel -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="#1A130F" stroke="#5A3F2E" stroke-width="10"/>
  <rect x="38" y="38" width="436" height="436" rx="76" fill="none" stroke="#33241B" stroke-width="3"/>

  <!-- Subtle CAD measurement grid inside the scanner bed -->
  <g stroke="#2F2119" stroke-width="2">
    <line x1="128" y1="54" x2="128" y2="458"/>
    <line x1="256" y1="54" x2="256" y2="458"/>
    <line x1="384" y1="54" x2="384" y2="458"/>
    <line x1="54" y1="128" x2="458" y2="128"/>
    <line x1="54" y1="256" x2="458" y2="256"/>
    <line x1="54" y1="384" x2="458" y2="384"/>
  </g>

  <!-- Precision ruler ticks along left & bottom optical rails -->
  <g stroke="#7A563E" stroke-width="3" stroke-linecap="square">
    <line x1="52" y1="112" x2="66" y2="112"/>
    <line x1="52" y1="160" x2="62" y2="160"/>
    <line x1="52" y1="208" x2="66" y2="208"/>
    <line x1="52" y1="304" x2="66" y2="304"/>
    <line x1="52" y1="352" x2="62" y2="352"/>
    <line x1="52" y1="400" x2="66" y2="400"/>

    <line x1="112" y1="460" x2="112" y2="446"/>
    <line x1="160" y1="460" x2="160" y2="450"/>
    <line x1="208" y1="460" x2="208" y2="446"/>
    <line x1="256" y1="460" x2="256" y2="440"/>
    <line x1="304" y1="460" x2="304" y2="446"/>
    <line x1="352" y1="460" x2="352" y2="450"/>
    <line x1="400" y1="460" x2="400" y2="446"/>
  </g>

  <!-- Photo #1 (bottom-left): crooked print (-13 deg) measured by CAD wireframe -->
  <g transform="translate(208 332) rotate(-13)">
    <rect x="-112" y="-84" width="224" height="168" fill="#4A2117"/>
    <rect x="-112" y="-84" width="224" height="54" fill="#632B1D"/>
    <rect x="-112" y="-30" width="224" height="52" fill="#542519"/>
    <rect x="-112" y="22" width="224" height="62" fill="#3D1A12"/>
    <!-- Inner vintage frame & wireframe diagonals -->
    <rect x="-98" y="-70" width="196" height="140" fill="none" stroke="#B85D3B" stroke-width="3" stroke-dasharray="10 6"/>
    <line x1="-98" y1="-70" x2="98" y2="70" stroke="#8C4229" stroke-width="2"/>
    <line x1="98" y1="-70" x2="-98" y2="70" stroke="#8C4229" stroke-width="2"/>
    <!-- Precision amber CAD oriented bounding box -->
    <rect x="-112" y="-84" width="224" height="168" fill="none" stroke="#F4A236" stroke-width="7"/>
    <!-- Corner registration nodes -->
    <circle cx="-112" cy="-84" r="12" fill="#E84A27" stroke="#1A130F" stroke-width="4"/>
    <circle cx="112" cy="-84" r="12" fill="#E84A27" stroke="#1A130F" stroke-width="4"/>
    <circle cx="112" cy="84" r="12" fill="#E84A27" stroke="#1A130F" stroke-width="4"/>
    <circle cx="-112" cy="84" r="12" fill="#E84A27" stroke="#1A130F" stroke-width="4"/>
  </g>

  <!-- Mathematically exact 13-degree CAD datum & deskew arc anchored at TL corner (80, 275.3) -->
  <line x1="92" y1="275.3" x2="188" y2="275.3" stroke="#F4A236" stroke-width="3" stroke-dasharray="6 5"/>
  <path d="M 164 275.3 A 84 84 0 0 0 161.8 256.4" fill="none" stroke="#F4A236" stroke-width="4"/>

  <!-- Photo #2 (top-right): extracted, deskewed (0 deg) restored warm-gold print -->
  <g transform="translate(230 72)">
    <rect x="10" y="10" width="202" height="166" fill="#0E0907"/>
    <rect x="0" y="0" width="202" height="166" fill="#F5E6CC"/>
    <!-- Stepped warm emulsion exposure bands -->
    <rect x="14" y="14" width="174" height="44" fill="#F2B84B"/>
    <rect x="14" y="58" width="174" height="44" fill="#E28732"/>
    <rect x="14" y="102" width="174" height="50" fill="#C45125"/>
    <!-- Minimal CAD crop-corner ticks -->
    <g stroke="#1A130F" stroke-width="4" fill="none">
      <polyline points="24,42 24,24 42,24"/>
      <polyline points="160,24 178,24 178,42"/>
      <polyline points="24,124 24,142 42,142"/>
      <polyline points="160,142 178,142 178,124"/>
    </g>
    <!-- Center optical target crosshair -->
    <line x1="87" y1="83" x2="115" y2="83" stroke="#F5E6CC" stroke-width="4"/>
    <line x1="101" y1="69" x2="101" y2="97" stroke="#F5E6CC" stroke-width="4"/>
    <rect x="0" y="0" width="202" height="166" fill="none" stroke="#FF6B2B" stroke-width="6"/>
  </g>

  <!-- Flatbed optical scan bar cleanly separating upper extracted print & lower raw scan -->
  <line x1="48" y1="246" x2="464" y2="246" stroke="#FF6B2B" stroke-width="8"/>
  <line x1="48" y1="246" x2="464" y2="246" stroke="#FFD699" stroke-width="2.5"/>
  <rect x="40" y="232" width="18" height="28" rx="4" fill="#FF6B2B" stroke="#1A130F" stroke-width="3"/>
  <rect x="454" y="232" width="18" height="28" rx="4" fill="#FF6B2B" stroke="#1A130F" stroke-width="3"/>
</svg>
