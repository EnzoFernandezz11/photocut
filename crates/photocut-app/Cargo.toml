[package]
name = "photocut-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
photocut-core = { path = "../photocut-core" }
eframe = { version = "0.31", features = ["wgpu"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
rayon = "1.10"

[build-dependencies]
winresource = "0.1"
