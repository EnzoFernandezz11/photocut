name: CI & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MODEL_FILE: orientation_model_v2_0.9882.onnx
  MODEL_URL: https://huggingface.co/DuarteBarbosa/deep-image-orientation-detection/resolve/main/orientation_model_v2_0.9882.onnx

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run unit & stress tests
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release -p photocut-app

      - name: Cache ONNX orientation model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/${{ env.MODEL_FILE }}
          key: onnx-orient-v2-0.9882

      - name: Download ONNX orientation model
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models
          curl -fSL "$MODEL_URL" -o "models/$MODEL_FILE"

      - name: Package portable Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev" }
          $bundle = "dist/PhotoCut"
          New-Item -ItemType Directory -Force -Path "$bundle/models" | Out-Null
          Copy-Item "target/release/photocut-app.exe" "$bundle/PhotoCut.exe"
          Copy-Item "models/$env:MODEL_FILE" "$bundle/models/$env:MODEL_FILE"
          Copy-Item "docs/LEEME-USUARIO.txt" "$bundle/LEEME.txt"
          $zipPath = "dist/PhotoCut-$ver-windows-x86_64.zip"
          Compress-Archive -Path $bundle -DestinationPath $zipPath -Force
          Write-Host "Created $zipPath"

      - name: Package portable Linux tar.gz
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VER=$( [ "${GITHUB_REF_TYPE}" = "tag" ] && echo "${GITHUB_REF_NAME}" || echo "dev" )
          BUNDLE="dist/PhotoCut"
          mkdir -p "$BUNDLE/models"
          cp "target/release/photocut-app" "$BUNDLE/PhotoCut"
          chmod +x "$BUNDLE/PhotoCut"
          cp "models/$MODEL_FILE" "$BUNDLE/models/$MODEL_FILE"
          cp "docs/LEEME-USUARIO.txt" "$BUNDLE/LEEME.txt"
          TAR_PATH="dist/PhotoCut-${VER}-linux-x86_64.tar.gz"
          tar -czf "$TAR_PATH" -C dist PhotoCut
          echo "Created $TAR_PATH"

      - name: Upload portable bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: photocut-${{ matrix.platform }}-portable
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release with portable ZIP & tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "PhotoCut ${GITHUB_REF_NAME}" \
            --notes "Paquetes portables listos para usar (incluyen ejecutable + modelo local de IA de orientación + guía rápida LEEME.txt). En Windows: descomprimir el .zip y abrir PhotoCut.exe." \
            --latest
