[workspace]
resolver = "2"
members = [
    "crates/photocut-core",
    "crates/photocut-app",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Fast offline desktop app to automatically detect, crop, deskew, orient, and restore scanned photos in full resolution."
repository = "https://github.com/EnzoFernandezz11/photocut"
